# Coturn TURN Server Configuration
# This file is used by the start.sh and start-with-turn.js scripts

# Listening port (default 3478)
listening-port=3478
listening-ip=127.0.0.1

# External IP (set this to your server's public IP if known)
# For localhost testing, leave commented out
# external-ip=YOUR_PUBLIC_IP

# Realm (can be your domain or localhost for testing)
realm=localhost

# User credentials for TURN authentication
# Format: username:password
# For local testing, using simple credentials
user=testuser:testpass

# Enable TURN relay
relay-ip=127.0.0.1

# Logging
log-file=./turn.log
verbose

# Security settings
no-cli
no-tls
no-dtls

# Allow loopback connections (for localhost testing)
no-multicast-peers
no-stdout-log

# Min/Max port range for relayed connections
min-port=49152
max-port=65535

# Use static auth secret (simpler for local testing)
static-auth-secret=testsecret
